name: MineradioApple
options:
  bundleIdPrefix: com.swordingk
  deploymentTarget:
    iOS: '17.0'
targets:
  MineradioApple:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
      - path: Web
        type: folder
        buildPhase: resources
      - path: ../../qishui-auth-v6
        type: folder
        buildPhase: resources
      - path: GeneratedWeb
        type: folder
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
      - path: ../../NOTICE.md
        buildPhase: resources
      - path: ../../public
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swordingk.mineradio.apple.preview
        PRODUCT_NAME: Mineradio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NV5R86Q3MS
    preBuildScripts:
      - name: Bundle original web modules without synchronous XHR
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          /usr/bin/env node "$SRCROOT/scripts/build-web-bundle.cjs"
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mineradio
        CFBundleShortVersionString: '0.4.2'
        CFBundleVersion: '10'
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 连接你配置的开发电脑，运行原版 Mineradio 网页与音乐接口。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
  MineradioAppleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MineradioApple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swordingk.mineradio.apple.preview.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: NV5R86Q3MS
        CODE_SIGN_STYLE: Automatic
schemes:
  MineradioApple:
    build:
      targets:
        MineradioApple: all
    test:
      targets:
        - MineradioAppleUITests
    archive:
      config: Release
